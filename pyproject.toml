[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "divineguard-saas-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
description = "DivineGuard starter implementation"

[tool.setuptools.packages.find]
include = ["pulse*", "grayfox*", "platform_core*"]
